name: PR creation

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  id-token: write
  issues: write

jobs:
  create-pr:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: create pull request
        run: gh pr create -B feature-branch-pr-creation -H main --title 'Merge branch_to_merge into base_branch' --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
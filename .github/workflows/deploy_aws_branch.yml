name: PR review approved.

on:
  workflow_dispatch:
    inputs:
      run-DBT-Docker-Step-flag:
        type: boolean
        description: Run DBT Docker step?
        required: false
        default: false
      invoke_lambda_during_deployment:
        type: boolean
        description: Invoke Lambda Function(s) during deployment?
        required: false
        default: false

permissions:
  contents: read
  packages: read
  actions: read
  id-token: write
  issues: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: create pull request
        run: gh pr create -B feature-branch-pr-creation -H main --title 'Merge branch_to_merge into base_branch' --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: PR creation

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type:'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - hotfix
        default: 'minor'

permissions:
  contents: write #needed
  packages: read
  actions: read
  id-token: write
  issues: write
  pull-requests: write #needed

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: create pull request
        run: |
            gh pr create --fill -B main -H feature-branch-pr-creation \
            -t 'Merge branch_to_merge into base_branch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}